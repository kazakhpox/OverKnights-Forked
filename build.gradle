plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = "${mod_version}+${minecraft_version}"
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup('maven.modrinth') }
    }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // Only data and a few items: the mods are needed at run time (and here in dev), not to compile.
    runtimeOnly "maven.modrinth:overgeared:${overgeared_version}"
    runtimeOnly "maven.modrinth:knights-and-heraldry:${knightsheraldry_version}"
    runtimeOnly "maven.modrinth:stoneycore:${stoneycore_version}"
    runtimeOnly "maven.modrinth:geckolib:${geckolib_version}"
    runtimeOnly "maven.modrinth:cloth-config:${cloth_config_version}"
    runtimeOnly "maven.modrinth:curios:${curios_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            overgeared_version_range: overgeared_version_range,
            knightsheraldry_version_range: knightsheraldry_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar) {
    from('LICENSE') {
        rename { "LICENSE_${mod_id}" }
    }
}

// Dev only, never in the jar: "./gradlew runCheck" starts a server with the mods and checks that every recipe loaded.
sourceSets {
    devtools {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    devtoolsRuntimeOnly.extendsFrom runtimeOnly
}
neoForge.addModdingDependenciesTo(sourceSets.devtools)
neoForge.mods.register('overknights_devtools') { sourceSet(sourceSets.devtools) }
neoForge.runs.register('check') {
    server()
    sourceSet = sourceSets.devtools
    gameDirectory = project.file('run-server')
    systemProperty 'overknights.check', project.file('src/main/resources/data').absolutePath
    programArgument '--nogui'
}
